<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title th:text="${title}">Asset</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div th:replace="~{fragments/site-shell :: siteNav('assets')}"></div>

<form method="post" th:action="${action}">
    <input type="hidden" name="id" th:value="${form.id}" />
    <label>Name: <input name="name" th:value="${form.name}" /></label><br/>
    <label>Category:
        <select name="category">
            <option th:value="EQUIPMENT" th:selected="${form.category == 'EQUIPMENT'}">EQUIPMENT</option>
            <option th:value="MATERIAL" th:selected="${form.category == 'MATERIAL'}">MATERIAL</option>
            <option th:value="INVENTORY" th:selected="${form.category == 'INVENTORY'}">INVENTORY</option>
        </select>
    </label><br/>
    <label>Quantity: <input type="number" min="0" name="quantity" th:value="${form.quantity}" /></label><br/>
    <label>Unit: <input name="unit" th:value="${form.unit}" /></label><br/>
    <label>Location: <input name="location" th:value="${form.location}" /></label><br/>
    <label>Notes: <input name="notes" th:value="${form.notes}" /></label><br/>
    <label>Depends on asset ids (csv): <input name="dependencyAssetIds" th:value="${form.dependencyAssetIds}" placeholder="asset-1, asset-2" /></label><br/>
    <label>Cost per piece: <input type="number" min="0" step="0.01" name="costPerPiece" th:value="${form.costPerPiece}" /></label><br/>
    <label>Estimated arrival (hours): <input type="number" min="0" name="estimatedArrivalHours" th:value="${form.estimatedArrivalHours}" placeholder="Leave 0 if unknown" /></label><br/>
    <label>Supplier node id: <input name="supplierNodeId" th:value="${form.supplierNodeId}" /></label><br/>
    <button type="submit">Save</button>
</form>

<script src="/js/site.js"></script>

</body>
</html>
