<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="siteNav(active)" class="site-nav">
    <div class="site-nav__brand">
        <a class="site-nav__home" href="/">Resource Scheduler</a>
        <span class="site-nav__tag">Resource conflict system</span>
    </div>
    <div class="site-nav__links">
        <a class="nav-link" th:classappend="${active == 'home'} ? ' is-active'" href="/">Home</a>
        <a class="nav-link" th:classappend="${active == 'resources'} ? ' is-active'" href="/resources">Resources</a>
        <a class="nav-link" th:classappend="${active == 'tasks'} ? ' is-active'" href="/tasks">Tasks</a>
        <a class="nav-link" th:classappend="${active == 'audits'} ? ' is-active'" href="/audits">Audits</a>
        <a th:if="${isAdmin}" class="nav-link nav-admin" th:classappend="${active == 'simulation'} ? ' is-active'" href="/simulate/ui">Simulation</a>
        <a th:if="${isAdmin}" class="nav-link nav-admin" th:classappend="${active == 'admin-users'} ? ' is-active'" href="/admin/users">User Profiles</a>
    </div>
    <div class="site-nav__actions">
        <span class="role-badge" th:text="${currentRole}"></span>
        <span class="site-nav__user" th:text="${currentUsername}"></span>
        <a th:if="${currentRole != 'GUEST'}" class="nav-link" href="/account">My Account</a>
            <a class="nav-link" th:classappend="${active == 'assets'} ? ' is-active'" href="/assets">Assets</a>
        <a th:if="${currentRole == 'GUEST'}" class="nav-link" href="#login-modal">Sign in</a>
        <a th:if="${currentRole == 'GUEST'}" class="nav-link nav-admin" href="#register-modal">Register</a>
        <a th:if="${currentRole != 'GUEST'}" class="nav-link" href="/logout">Logout</a>
    </div>
</nav>

<div th:fragment="authModals" class="auth-layer">
    <div class="auth-modal" id="login-modal">
        <div class="auth-modal__panel">
            <div class="auth-modal__header">
                <div>
                    <p class="eyebrow">Access</p>
                    <h2>Sign in</h2>
                </div>
                <a class="modal-close" href="#">Close</a>
            </div>
            <form method="post" th:action="@{/login}" class="auth-form">
                <label>Username
                    <input name="username" autocomplete="username" />
                </label>
                <label>Password
                    <input type="password" name="password" autocomplete="current-password" />
                </label>
                <button type="submit">Sign in</button>
                <p class="auth-switch">Need an account? <a href="#register-modal">Register</a></p>
            </form>
        </div>
    </div>

    <div class="auth-modal" id="register-modal">
        <div class="auth-modal__panel">
            <div class="auth-modal__header">
                <div>
                    <p class="eyebrow">Access</p>
                    <h2>Create account</h2>
                </div>
                <a class="modal-close" href="#">Close</a>
            </div>
            <form method="post" th:action="@{/register}" th:object="${form}" class="auth-form">
                <label>Username
                    <input th:field="*{username}" autocomplete="username" />
                </label>
                <label>Password
                    <input type="password" th:field="*{password}" autocomplete="new-password" />
                </label>
                <button type="submit">Create account</button>
                <p class="auth-switch">Already registered? <a href="#login-modal">Sign in</a></p>
                <p class="auth-error" th:if="${registrationError}" th:text="${registrationError}"></p>
            </form>
        </div>
    </div>
</div>
</body>
</html>
