<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Audit</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<h1>Audit</h1>
<p><a href="/audits">Back to audits</a></p>
<div>
    <p><strong>ID:</strong> <span th:text="${audit.id}"></span></p>
    <p><strong>Created:</strong> <span th:text="${audit.createdAt}"></span></p>
    <p><strong>Summary:</strong> <span th:text="${audit.summary}"></span></p>
    <h3>Payload</h3>
    <pre th:text="${audit.payload}"></pre>
</div>
</body>
</html>
