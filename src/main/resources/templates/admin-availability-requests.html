<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Availability Requests</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div th:replace="~{fragments/site-shell :: siteNav('admin-users')}"></div>
<section class="page-note">
    <p class="eyebrow">Availability Requests</p>
    <h1>Pending requests</h1>
    </section>

<table border="1">
    <thead>
    <tr><th>ID</th><th>User</th><th>Requested Hours</th><th>From</th><th>To</th><th>Submitted</th><th>Actions</th></tr>
    </thead>
    <tbody>
    <tr th:each="r : ${requests}">
        <td th:text="${r.id}"></td>
        <td th:text="${r.username}"></td>
        <td th:text="${r.requestedAvailableHours}"></td>
        <td th:text="${r.startDate}"></td>
        <td th:text="${r.endDate}"></td>
        <td th:text="${r.createdAt}"></td>
        <td>
            <form th:action="@{/admin/availability-requests/{id}/approve(id=${r.id})}" method="post" style="display:inline;"><button type="submit">Approve</button></form>
            <form th:action="@{/admin/availability-requests/{id}/reject(id=${r.id})}" method="post" style="display:inline;"><button type="submit">Reject</button></form>
        </td>
    </tr>
    </tbody>
</table>

<p><a href="/admin/users">Back</a></p>
</body>
</html>
