<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Resources</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div th:replace="~{fragments/site-shell :: siteNav('resources')}"></div>
<section class="page-note">
    <p class="eyebrow">People</p>
    <h1>Assignees</h1>
    </section>
<p>
    <button th:if="${isAdmin}" type="button" id="refresh-resources">Refresh</button>
    <a th:if="${isAdmin}" href="/resources/new" style="margin-left: .5rem;">Add Resource</a>
</p>

<table border="1">
    <thead>
    <tr><th>ID</th><th>Name</th><th>Skills</th><th>Max Hours</th><th>Salary</th><th>Available Hours</th><th>Location</th><th th:if="${isAdmin}">Actions</th></tr>
    </thead>
    <tbody id="resources-body">
    <tr th:each="r: ${resources}">
        <td th:text="${r.id()}"></td>
        <td th:text="${r.name()}"></td>
        <td th:text="${r.skills()}"></td>
        <td th:text="${r.maxWorkloadHours()}"></td>
        <td th:text="${r.salaryPerHour()}"></td>
        <td th:text="${r.availableHoursPerWeek()}"></td>
        <td th:text="${r.location()}"></td>
        <td th:if="${isAdmin}">
            <a th:href="@{/resources/edit/{id}(id=${r.id()})}">Edit</a>
            <button type="button" class="delete-resource" th:attr="data-id=${r.id()}">Delete</button>
        </td>
    </tr>
    </tbody>
</table>

<script th:if="${isAdmin}" src="/js/dashboard.js"></script>
<script src="/js/site.js"></script>

</body>
</html>
